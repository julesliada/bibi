<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibi 🦉 — говорим по-английски</title>
<style>
  :root{
    --purple:#8b6cf6; --purple-d:#6b4fd8; --lav:#efe7ff; --pink:#ff8fb1; --orange:#ffb347;
    --mint:#5cc8a8; --text:#3b2a5c; --muted:#8a7fa3; --card:#fff; --r:22px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--text);
    background:linear-gradient(160deg,#fdf0ff 0%,#eaf4ff 55%,#fff6e8 100%);min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(#d9c9ff 1.5px,transparent 1.6px);background-size:28px 28px}
  .hidden{display:none!important}
  .screen{max-width:980px;margin:0 auto;padding:18px;position:relative}
  h1,h2,h3{margin:.3em 0}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{border:none;border-radius:999px;padding:11px 20px;font:inherit;font-weight:bold;cursor:pointer;
    background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d);transition:transform .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-d)}
  .btn.ghost{background:#fff;color:var(--purple-d);box-shadow:0 3px 0 #ddd2ff;border:2px solid #ddd2ff}
  .btn.danger{background:#ff7a8a;box-shadow:0 4px 0 #d95566}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.on{background:var(--mint);box-shadow:0 3px 0 #3ea486;color:#fff;border:none}
  .btn.on-bad{background:#ff7a8a;box-shadow:0 3px 0 #d95566;color:#fff;border:none}
  .btn:disabled{opacity:.5;cursor:default}
  .inp{font:inherit;padding:11px 14px;border-radius:14px;border:2px solid #ddd2ff;background:#fff;color:var(--text);outline:none}
  .inp:focus{border-color:var(--purple)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .row.between{justify-content:space-between} .row.top{align-items:flex-start} .row textarea{flex:1;min-width:220px}
  .row-end{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin:12px 0;box-shadow:0 6px 20px rgba(139,108,246,.10)}
  .card.info{background:#fff8e6}

  /* ---- совушка ---- */
  .owl{width:120px;height:120px;overflow:visible}
  .owl.big{width:190px;height:190px}
  .owl.mini{width:42px;height:42px}
  .owl .lids ellipse{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
  .owl.live .owl-body{transform-origin:100px 190px;animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.02,.98)}}
  .owl .beak{transform-box:fill-box;transform-origin:center top}
  .owl.talking .beak{animation:talk .22s infinite alternate}
  @keyframes talk{to{transform:scaleY(1.45)}}
  .owl.talking .owl-body{animation:bob .45s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-4px)}}
  .owl .wing-l,.owl .wing-r{transform-box:fill-box}
  .owl .wing-l{transform-origin:right top} .owl .wing-r{transform-origin:left top}
  .owl.happy .wing-l{animation:flapL .25s 5 alternate} .owl.happy .wing-r{animation:flapR .25s 5 alternate}
  @keyframes flapL{to{transform:rotate(35deg)}} @keyframes flapR{to{transform:rotate(-35deg)}}

  /* ---- вход ---- */
  #scr-login{text-align:center;padding-top:40px}
  .login-card{max-width:420px;margin:0 auto;background:#fff;border-radius:32px;padding:26px;box-shadow:0 10px 30px rgba(139,108,246,.18)}
  .title{font-size:34px;color:var(--purple-d);margin:4px 0}
  #code{width:100%;text-align:center;font-size:26px;letter-spacing:3px;text-transform:uppercase;margin:12px 0}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .link{background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;margin-top:14px}

  /* ---- главная ---- */
  .home-head{display:flex;align-items:center;gap:14px}
  .home-head h1{font-size:28px}
  #topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:18px 0}
  .topic{border:none;border-radius:24px;padding:20px 14px;cursor:pointer;font:inherit;color:var(--text);position:relative;
    display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.07);transition:transform .15s}
  .topic:hover{transform:translateY(-4px) rotate(-1deg)}
  .t-icon{font-size:44px} .t-en{font-weight:bold;font-size:19px} .t-ru{font-size:14px;color:var(--muted)}
  .t-done{position:absolute;top:10px;right:12px;background:#fff;border-radius:99px;padding:2px 8px;font-size:12px;color:var(--mint);font-weight:bold}

  /* ---- чат ---- */
  .chat-head{display:flex;align-items:center;gap:12px}
  .chat-head .owl{width:96px;height:96px}
  .chat-head h2{flex:1}
  .progress{height:10px;background:#fff;border-radius:99px;overflow:hidden;margin:6px 0 2px}
  #progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .5s}
  #messages{background:rgba(255,255,255,.65);border-radius:var(--r);padding:14px;height:calc(100vh - 360px);min-height:260px;overflow-y:auto}
  .msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
  .msg.me{justify-content:flex-end}
  .bubble{max-width:75%;padding:11px 15px;border-radius:20px;font-size:18px;line-height:1.35;position:relative}
  .bot .bubble{background:#fff;border-bottom-left-radius:6px;box-shadow:0 3px 10px rgba(139,108,246,.12)}
  .me .bubble{background:var(--purple);color:#fff;border-bottom-right-radius:6px}
  .avatar{flex:none}
  .tr-btn{background:none;border:none;color:var(--purple);font-size:12px;cursor:pointer;padding:2px 0;text-decoration:underline}
  .tr{font-size:14px;color:var(--muted)}
  .ex{color:var(--purple-d);font-style:italic}
  .hint{margin-top:8px;background:#fff6dd;border-radius:14px;padding:10px;font-size:15px}
  .hint.good{background:#e3f8ef}
  .hint mark{background:#ffd1df;border-radius:6px;padding:0 4px}
  .hint-where{margin-top:6px}
  .dot{display:inline-block;width:9px;height:9px;background:var(--orange);border-radius:50%;margin-left:6px}
  .controls{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  #mic{width:84px;height:84px;border-radius:50%;font-size:38px;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(145deg,var(--pink),var(--purple));box-shadow:0 6px 0 var(--purple-d)}
  #mic.listening{animation:pulse 1s infinite;background:linear-gradient(145deg,#ff6b8a,#ff8f6b)}
  #mic:disabled{opacity:.45}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,107,138,.25),0 6px 0 var(--purple-d)}}
  .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:150px}
  #mic-label{font-size:13px;color:var(--muted);text-align:center}
  .text-wrap{flex:1;display:flex;gap:8px;min-width:240px}
  .text-wrap .inp{flex:1}
  #heard{min-height:24px;color:var(--purple-d);font-style:italic;margin-top:6px}

  /* ---- итоги ---- */
  #scr-summary{text-align:center}
  #sum-stars{font-size:52px;letter-spacing:6px}
  #sum-errors{text-align:left}
  .big-ok{font-size:22px;text-align:center}
  .err-row{background:#fff;border-radius:16px;padding:10px 14px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .err-row.clean{opacity:.75}
  .chip-line{margin:5px 0}
  .type{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;color:#fff;font-weight:bold}
  .t-omission{background:#ff8fb1} .t-addition{background:#f5a742} .t-misformation{background:#8b6cf6} .t-misordering{background:#45b894}
  .ok-tag{display:inline-block;background:#e3f8ef;color:#2f9a77;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:bold}
  .no-tag{display:inline-block;background:#ffe3e8;color:#d24a63;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:bold}
  .top-list li{margin:6px 0}

  /* ---- учитель ---- */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .tab{border:none;border-radius:99px;padding:10px 18px;font:inherit;font-weight:bold;background:#fff;color:var(--purple-d);cursor:pointer}
  .tab.active{background:var(--purple);color:#fff}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:left;color:var(--muted);font-weight:normal;border-bottom:2px solid var(--lav);padding:6px}
  .tbl td{padding:6px;border-bottom:1px solid #f2edff}
  .tbl a{color:var(--purple-d);font-weight:bold}
  code{background:var(--lav);padding:2px 8px;border-radius:8px;font-size:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
  .stat{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(139,108,246,.10)}
  .stat b{display:block;font-size:26px;color:var(--purple-d)} .stat span{font-size:13px;color:var(--muted)}
  .stat.hl{background:#efe7ff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr} .bubble{max-width:88%;font-size:16px} #messages{height:50vh}}
  .bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .bar-label{width:42%} .bar-track{flex:1;background:#f4f0ff;border-radius:99px;height:16px;overflow:hidden}
  .bar{height:100%;border-radius:99px} .bar-val{width:30px;text-align:right;font-weight:bold}
  .vcard.done{opacity:.7}
  .vtext{font-size:18px;margin:6px 0}
  .vline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:6px}

  /* ---- окна ---- */
  .modal{position:fixed;inset:0;background:rgba(59,42,92,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto}
  .modal-box .inp{width:100%}
  .sv p{margin:12px 0 6px;font-weight:bold}
  .faces{display:flex;gap:10px}
  .face{font-size:36px;background:#f6f2ff;border:3px solid transparent;border-radius:18px;padding:6px 10px;cursor:pointer}
  .face.sel{border-color:var(--purple);background:#efe7ff;transform:scale(1.1)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;
    padding:12px 20px;border-radius:99px;transition:transform .3s;z-index:60;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
  .warn{background:#fff3d6;border-radius:14px;padding:10px;margin:8px 0;font-size:14px}
</style>
</head>
<body>

<!-- ===== ВХОД ===== -->
<section id="scr-login" class="screen">
  <div class="login-card">
    <div id="login-owl"></div>
    <h1 class="title">Hi! I'm Bibi</h1>
    <p>Я помогу тебе говорить по-английски 💜</p>
    <input id="code" class="inp" placeholder="ТВОЙ КОД" autocomplete="off">
    <button class="btn" data-act="login" style="width:100%;font-size:20px">Войти</button>
    <p id="login-note" class="muted small"></p>
    <button class="link" data-act="teacher">Я учитель 🔒</button>
  </div>
</section>

<!-- ===== ГЛАВНАЯ УЧЕНИКА ===== -->
<section id="scr-home" class="screen hidden">
  <div class="home-head">
    <div id="home-owl"></div>
    <div style="flex:1"><h1 id="home-hello"></h1><div id="home-sub" class="muted"></div></div>
    <button class="btn ghost small" data-act="my-errors">📒 Мои ошибки</button>
    <button class="btn ghost small" data-act="logout">Выйти</button>
  </div>
  <h2>Выбери тему для разговора:</h2>
  <div id="topics"></div>
</section>

<!-- ===== РАЗГОВОР ===== -->
<section id="scr-chat" class="screen hidden">
  <div class="chat-head">
    <div id="chat-owl"></div>
    <div style="flex:1"><h2 id="chat-title"></h2><div class="progress"><div id="progress-bar"></div></div><div id="progress" class="muted small"></div></div>
    <button class="btn ghost small" data-act="stop">Закончить</button>
  </div>
  <div id="no-sr" class="warn hidden">В этом браузере нет распознавания речи. Откройте бота в Google Chrome или Microsoft Edge — или пишите ответы.</div>
  <div id="messages"></div>
  <div id="heard"></div>
  <div class="controls">
    <div class="mic-wrap"><button id="mic" data-act="mic" title="Говорить">🎤</button><div id="mic-label">Нажми и говори</div></div>
    <button class="btn ghost" data-act="repeat" title="Повторить вопрос">🔊 Ещё раз</button>
    <div class="text-wrap"><input id="text-answer" class="inp" placeholder="…или напиши ответ" autocomplete="off"><button id="send" class="btn" data-act="send">➤</button></div>
  </div>
</section>

<!-- ===== ИТОГИ ===== -->
<section id="scr-summary" class="screen hidden">
  <div id="sum-owl"></div>
  <div id="sum-stars"></div>
  <h2>Отличная работа!</h2>
  <p id="sum-text"></p>
  <div id="sum-errors"></div>
  <div class="row" style="justify-content:center;margin-top:18px">
    <button class="btn" data-act="again">Ещё тема</button>
    <button class="btn ghost" data-act="logout">Выйти</button>
  </div>
</section>

<!-- ===== УЧИТЕЛЬ ===== -->
<section id="scr-teacher" class="screen hidden">
  <div class="row between"><h1>🦉 Панель учителя</h1><button class="btn ghost small" data-act="exit-teacher">Выйти</button></div>
  <div class="tabs">
    <button class="tab" data-tab="classes">🏫 Классы и ученики</button>
    <button class="tab" data-tab="stats">📊 Статистика</button>
    <button class="tab" data-tab="check">✅ Проверка бота</button>
    <button class="tab" data-tab="settings">⚙️ Настройки и данные</button>
  </div>
  <div id="t-content"></div>
</section>

<div id="modal" class="modal hidden"><div id="modal-box" class="modal-box"></div></div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".json,application/json" class="hidden">

<script>
// =====================================================================
//  ПРАВИЛА ПОИСКА ОШИБОК
//  Типы ошибок взяты из классификации Х. Дьюлей, М. Барт и С. Крашена:
//  пропуск, лишний элемент, неправильная форма, неправильный порядок слов.
//  Каждое правило ищет в предложении одну типичную ошибку.
// =====================================================================

const TYPES = {
  omission: 'Пропуск',
  addition: 'Лишний элемент',
  misformation: 'Неправильная форма',
  misordering: 'Неправильный порядок слов'
};

// --- Словари ---------------------------------------------------------
const W = s => new Set(s.trim().split(/\s+/));

const VERBS = W(`like love live play go want watch eat drink swim run walk work study speak
 help need know think get make take see come cook dance sing ride draw write listen sleep
 wear clean wash buy open visit travel feel hate enjoy look teach learn drive fly jump climb
 fish ski skate hunt sit stay tell say meet give find bring catch wake begin spend grow build
 paint collect hope remember agree read have do`);

const STATIVE = W('think know remember hope like love want hate need feel agree');

const PAST_IRR = {go:'went',eat:'ate',see:'saw',do:'did',have:'had',make:'made',take:'took',
  come:'came',buy:'bought',run:'ran',swim:'swam',write:'wrote',read:'read',sleep:'slept',
  drink:'drank',sing:'sang',ride:'rode',draw:'drew',get:'got',give:'gave',meet:'met',fly:'flew',
  find:'found',think:'thought',know:'knew',speak:'spoke',wake:'woke',wear:'wore',teach:'taught',
  drive:'drove',bring:'brought',catch:'caught',begin:'began',spend:'spent',grow:'grew',
  build:'built',feel:'felt',sit:'sat',tell:'told',say:'said'};

const WRONG_PAST = {goed:'went',eated:'ate',doed:'did',haved:'had',maked:'made',taked:'took',
  comed:'came',buyed:'bought',runned:'ran',swimmed:'swam',writed:'wrote',sleeped:'slept',
  drinked:'drank',rided:'rode',drawed:'drew',getted:'got',gived:'gave',meeted:'met',flyed:'flew',
  finded:'found',thinked:'thought',knowed:'knew',speaked:'spoke',weared:'wore',teached:'taught',
  drived:'drove',bringed:'brought',catched:'caught',spended:'spent',growed:'grew',builded:'built',
  feeled:'felt',sitted:'sat',telled:'told',sayed:'said',winned:'won',losed:'lost',breaked:'broke',
  falled:'fell',leaved:'left',readed:'read',putted:'put',cutted:'cut'};

const WRONG_PLURAL = {childs:'children',childrens:'children',mans:'men',mens:'men',womans:'women',
  womens:'women',foots:'feet',feets:'feet',tooths:'teeth',teeths:'teeth',mouses:'mice',
  sheeps:'sheep',peoples:'people',deers:'deer',gooses:'geese'};

const ADV = W('always usually often sometimes never also really just still rarely seldom normally even only');
const INTENS = W('very so really too');
const ADJ = W(`happy sad tired hungry thirsty fine good bad tall short small big beautiful pretty
 funny kind smart clever busy ready sick ill cold hot warm bored boring angry friendly nice young
 strong lazy shy cute sleepy excited interested afraid scared late great old new strict`);
const NUMW = W('one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty');
const MANY = W('two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty many several few');

const POSS = W('my his her our your their');
const SUBJ_ADJ = W('best little big older younger elder new');
const PERSON = W(`mother mom mum mama father dad papa sister brother friend cat dog teacher grandma
 grandmother granny grandpa grandfather aunt uncle family cousin baby pet`);
const PERSON_PL = W('parents grandparents friends brothers sisters cousins cats dogs pets teachers');
const BARE_START = W('mom mum dad mama papa mother father');

// слова, после которых местоимение — это НЕ подлежащее (I help my mom cook, can you…)
const PRE_SKIP = W(`do does did don't doesn't didn't can can't cannot could will won't would should
 must may might shall let lets let's help helps helped make makes made see sees saw watch watches
 watched hear hears heard am is are was were find finds found keep call`);

const AUX = W("do does did don't doesn't didn't can can't cannot could will won't would should must may might");
const MODAL = W("can can't cannot could must should will may might");
const BE = W('am is are was were');
const WH = W('what where when why how which');
const PRON_ALL = W('i you we they he she it');

const HAVE = W('have has got');
const HAVE_N = W(`dog cat brother sister bike bicycle computer phone horse cow parrot hamster rabbit
 friend car ball house flat room book pen bag pet puppy kitten cousin uncle aunt toy idea`);
const IS_N = W(`teacher doctor driver student pupil nurse farmer engineer cook builder hunter artist
 singer dancer programmer businessman policeman fireman vet pilot dog cat horse cow bird animal
 boy girl friend`);
const PRE_N_ADJ = W('good nice kind big small funny beautiful clever strict little');
const COUNT_N = W(`dog cat brother sister bike bicycle computer phone horse cow parrot hamster rabbit
 friend car ball house room book pen pencil bag apple orange bird animal child man woman person
 foot tooth mouse year day lesson subject teacher student pupil toy game cousin puppy kitten egg
 sweet cake fox wolf bear hare song film movie picture flower tree chair table window boy girl
 baby time hour week month uncle aunt`);
const LIKE_COMP = W('my your his her our their a an the me him you them us this that');
const LISTEN_OBJ = W('music songs song radio the my me him her rap rock pop a teacher mom mum');
const GO = W('go goes went going come comes came coming get gets got');
const ING_ACT = W('fishing shopping swimming skiing skating hunting camping dancing walking running');
const DAYS = W('monday tuesday wednesday thursday friday saturday sunday');
const SEASONS = W('summer winter spring autumn fall');
const DAYPART = W('morning afternoon evening');
const TIME_N = W('week weekend year month summer winter spring autumn night monday tuesday wednesday thursday friday saturday sunday time');
const SHORT_ADJ = W('big small tall short fast slow cold hot warm old young long cheap nice strong high low smart');

// --- Помощники: формы слов --------------------------------------------
function third(v) {               // like -> likes, go -> goes, study -> studies
  if (v === 'have') return 'has';
  if (v === 'go') return 'goes';
  if (v === 'do') return 'does';
  if (/(s|sh|ch|x|o)$/.test(v)) return v + 'es';
  if (/[^aeiou]y$/.test(v)) return v.slice(0, -1) + 'ies';
  return v + 's';
}
function past(v) {                // play -> played, go -> went
  if (PAST_IRR[v]) return PAST_IRR[v];
  if (v.endsWith('e')) return v + 'd';
  if (/[^aeiou]y$/.test(v)) return v.slice(0, -1) + 'ied';
  if (['stop', 'shop', 'jog', 'plan', 'travel'].includes(v)) return v + v.slice(-1) + 'ed';
  return v + 'ed';
}
function plural(n) {              // cat -> cats, child -> children
  const irr = {child:'children',man:'men',woman:'women',foot:'feet',tooth:'teeth',mouse:'mice',person:'people',
    fish:'fish',sheep:'sheep',deer:'deer',wolf:'wolves'};
  if (irr[n]) return irr[n];
  if (/(s|sh|ch|x)$/.test(n)) return n + 'es';
  if (/[^aeiou]y$/.test(n)) return n.slice(0, -1) + 'ies';
  return n + 's';
}
function comp(a) {                // big -> bigger
  if (a === 'good') return 'better';
  if (a === 'bad') return 'worse';
  if (['big', 'hot', 'fat', 'thin', 'sad'].includes(a)) return a + a.slice(-1) + 'er';
  if (a.endsWith('e')) return a + 'r';
  if (/[^aeiou]y$/.test(a)) return a.slice(0, -1) + 'ier';
  return a + 'er';
}
function needsAn(w) {
  if (['hour', 'honest', 'honour'].includes(w)) return true;
  if (/^(one|once|uni|use|usu|euro|eu)/.test(w)) return false;
  if (/^[aeio]/.test(w)) return true;
  if (/^u/.test(w)) return /^un/.test(w) || ['umbrella', 'uncle', 'ugly', 'up', 'under'].includes(w);
  return false;
}
const art = w => needsAn(w) ? 'an' : 'a';

const THIRD_REV = {};             // likes -> like
VERBS.forEach(v => { THIRD_REV[third(v)] = v; });
const PAST_REV = {};              // went -> go
Object.keys(PAST_IRR).forEach(v => { if (v !== 'read') PAST_REV[PAST_IRR[v]] = v; });
function pastBase(w) {            // played -> play, went -> go
  if (PAST_REV[w]) return PAST_REV[w];
  if (w.endsWith('ied') && VERBS.has(w.slice(0, -3) + 'y')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ed')) {
    for (const c of [w.slice(0, -1), w.slice(0, -2), w.slice(0, -3)]) if (VERBS.has(c)) return c;
  }
  return null;
}
const COMP_FORMS = new Set(['better', 'worse']);
SHORT_ADJ.forEach(a => COMP_FORMS.add(comp(a)));
const BAD_COMP = {gooder:'better', badder:'worse', beautifuler:'more beautiful', interestinger:'more interesting'};

// --- Разбиваем фразу на слова ------------------------------------------
const EXPAND = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is",
  "she's":"she is","it's":"it is","that's":"that is","what's":"what is","where's":"where is",
  "who's":"who is","there's":"there is","i've":"i have","you've":"you have","we've":"we have",
  "they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will",
  "we'll":"we will","they'll":"they will","isn't":"is not","aren't":"are not","wasn't":"was not",
  "weren't":"were not","i'd":"i would"};

function tokenize(text) {
  const raw = [];
  String(text).replace(/[’‘`]/g, "'").replace(/[^A-Za-z0-9' ]+/g, ' ').split(/\s+/).forEach(w => {
    w = w.replace(/^'+|'+$/g, '');
    if (!w) return;
    const l = w.toLowerCase();
    if (EXPAND[l]) {
      EXPAND[l].split(' ').forEach((p, k) => raw.push(k === 0 && w[0] !== w[0].toLowerCase() ? p[0].toUpperCase() + p.slice(1) : p));
    } else raw.push(w);
  });
  return { raw, t: raw.map(w => w.toLowerCase()) };
}

// --- Ищем подлежащее: he, she, I, my mum, my best friend ... ---------
function subj(t, i, ignoreSkip) {
  const w = t[i];
  if (!w) return null;
  if (!ignoreSkip && i > 0 && PRE_SKIP.has(t[i - 1])) return null;
  if (w === 'he' || w === 'she' || w === 'it') return { p: '3s', s: i, e: i };
  if (w === 'i') return { p: '1s', s: i, e: i };
  if (w === 'you' || w === 'we' || w === 'they') return { p: 'pl', s: i, e: i };
  if (i === 0 && BARE_START.has(w)) return { p: '3s', s: i, e: i };
  if (POSS.has(w)) {
    if (t[i - 1] === 'and') return null;          // me and my family go — подлежащее из двух частей
    let j = i + 1;
    if (SUBJ_ADJ.has(t[j])) j++;
    if (PERSON.has(t[j])) return { p: '3s', s: i, e: j };
    if (PERSON_PL.has(t[j])) return { p: 'pl', s: i, e: j };
  }
  return null;
}
function afterAdv(t, j) { while (ADV.has(t[j])) j++; return j; }
function verbBase(v) { return VERBS.has(v) ? v : (THIRD_REV[v] || null); }

// =====================================================================
//  САМИ ПРАВИЛА. Порядок важен: если два правила нашли ошибку в одном
//  месте, остаётся то, которое стоит выше.
// =====================================================================
const RULES = [
  { id: 'wrong_past', type: 'misformation', name: 'Неправильный глагол в прошедшем времени',
    hint: 'Это неправильный глагол: у него особая форма прошедшего времени (go → went, eat → ate). Вспомни её!',
    find(t, add) { t.forEach((w, i) => { if (WRONG_PAST[w]) add(i, i, [WRONG_PAST[w]]); }); } },

  { id: 'wh_order', type: 'misordering', name: 'Порядок слов в вопросе',
    hint: 'В вопросе после What / Where / When нужен помощник: do, does или am / is / are. Например: Where do you live? How old are you?',
    find(t, add, ctx) {
      if (!ctx.ask || !WH.has(t[0])) return;
      if (t[0] === 'how' && t[1] === 'old' && PRON_ALL.has(t[2]) && BE.has(t[3])) { add(0, 3, ['how', 'old', t[3], t[2]]); return; }
      let j = 1;
      if ((t[0] === 'what' || t[0] === 'which') && t[1] && !PRON_ALL.has(t[1]) && !POSS.has(t[1]) && !AUX.has(t[1]) && !BE.has(t[1])) j = 2;
      const s = subj(t, j, true);
      if (!s) return;
      if (BE.has(t[s.e + 1])) { add(0, s.e + 1, [...t.slice(0, j), t[s.e + 1], ...t.slice(j, s.e + 1)]); return; }
      const k = afterAdv(t, s.e + 1);
      const base = verbBase(t[k]);
      if (!base) return;
      add(0, k, [...t.slice(0, j), s.p === '3s' ? 'does' : 'do', ...t.slice(j, k), base]);
    } },

  { id: 'past_ctx', type: 'misformation', name: 'Нужно прошедшее время',
    hint: 'Мы говорим о прошлом (yesterday, last weekend), поэтому глагол нужен в прошедшем времени: play → played, go → went.',
    find(t, add, ctx) {
      const isPast = ctx.past || t.includes('yesterday') || t.includes('ago') || t.some((w, i) => w === 'last' && TIME_N.has(t[i + 1]));
      if (!isPast) return;
      if (t.some(w => ['will', 'tomorrow', 'usually', 'always', 'every', 'often', 'sometimes', 'never', 'going', 'now'].includes(w))) return;
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s) continue;
        const j = afterAdv(t, s.e + 1), v = t[j];
        if (v === "don't" || v === "doesn't") { add(s.s, j, [...t.slice(s.s, j), "didn't"]); continue; }
        const base = verbBase(v);
        if (!base || STATIVE.has(base) || base === 'read') continue;
        add(s.s, j, [...t.slice(s.s, j), past(base)]);
      }
    } },

  { id: 'be_form', type: 'misformation', name: 'Неправильная форма am / is / are, was / were',
    hint: 'Запомни: I am, he / she / it is, you / we / they are. В прошлом: I / he / she / it was, you / we / they were.',
    find(t, add) {
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s) continue;
        const b = t[s.e + 1]; if (!BE.has(b)) continue;
        let right;
        if (b === 'am' || b === 'is' || b === 'are') right = s.p === '1s' ? 'am' : s.p === '3s' ? 'is' : 'are';
        else { if (b === 'were' && ['if', 'wish'].includes(t[s.s - 1])) continue; right = s.p === 'pl' ? 'were' : 'was'; }
        if (right !== b) add(s.s, s.e + 1, [...t.slice(s.s, s.e + 1), right]);
      }
    } },

  { id: 'be_verb', type: 'addition', name: 'Лишний am / is / are перед глаголом',
    hint: 'Если в предложении уже есть глагол действия (like, play, live), то am / is / are не нужны: I like (а не I am like).',
    find(t, add) {
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s || t[s.s] === 'it') continue;
        const b = t[s.e + 1]; if (!BE.has(b)) continue;
        const j = afterAdv(t, s.e + 2), v = t[j];
        if (!VERBS.has(v) || ['have', 'do', 'cook', 'fish', 'read'].includes(v)) continue;
        if (v === 'like' && LIKE_COMP.has(t[j + 1])) continue;     // I am like my mum — так можно
        const nv = (b === 'was' || b === 'were') ? past(v) : (s.p === '3s' ? third(v) : v);
        add(s.s, j, [...t.slice(s.s, s.e + 1), ...t.slice(s.e + 2, j), nv]);
      }
    } },

  { id: 'no_be', type: 'omission', name: 'Пропущен am / is / are',
    hint: 'В английском предложении обязательно нужен глагол. Перед словами-описаниями (happy, ten years old, from Yakutia) ставим am / is / are.',
    find(t, add, ctx) {
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s) continue;
        let k = s.e + 1; if (INTENS.has(t[k])) k++;
        const w = t[k]; if (!w) continue;
        if (ADJ.has(w) || w === 'from' || NUMW.has(w) || /^\d+$/.test(w)) {
          const be = ctx.past ? (s.p === 'pl' ? 'were' : 'was') : (s.p === '1s' ? 'am' : s.p === '3s' ? 'is' : 'are');
          add(s.s, s.e, [...t.slice(s.s, s.e + 1), be]);
        }
      }
    } },

  { id: 'aux_form', type: 'addition', name: 'Лишнее -s или прошедшее время после do / did / can',
    hint: 'После do / does / did / don’t / didn’t / can / will глагол стоит в начальной форме — без -s и без прошедшего времени: didn’t go, can swim.',
    find(t, add) {
      for (let i = 0; i < t.length; i++) {
        if (!AUX.has(t[i])) continue;
        let j = i + 1;
        const s = subj(t, j, true); if (s) j = s.e + 1;
        if (t[j] === 'not') j++;
        j = afterAdv(t, j);
        const v = t[j]; if (!v) continue;
        let base = null;
        if (THIRD_REV[v]) base = THIRD_REV[v];
        else base = pastBase(v);
        if (base && base !== v) add(i, j, [...t.slice(i, j), base]);
      }
    } },

  { id: 'has_does', type: 'misformation', name: 'have / do вместо has / does',
    hint: 'С he, she, it и одним человеком (my mum) говорим has, does, doesn’t — а не have, do, don’t.',
    find(t, add) {
      const map = { have: 'has', do: 'does', "don't": "doesn't" };
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s || s.p !== '3s') continue;
        const j = afterAdv(t, s.e + 1);
        if (map[t[j]]) add(s.s, j, [...t.slice(s.s, j), map[t[j]]]);
      }
    } },

  { id: 's3', type: 'omission', name: 'Нет окончания -s (he / she / it)',
    hint: 'Когда говорим о нём, о ней или об одном человеке (he, she, it, my mum), к глаголу добавляем окончание -s: she likes, he plays.',
    find(t, add) {
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s || s.p !== '3s') continue;
        const j = afterAdv(t, s.e + 1), v = t[j];
        if (VERBS.has(v) && !['have', 'do', 'read'].includes(v)) add(s.s, j, [...t.slice(s.s, j), third(v)]);
      }
    } },

  { id: 'have_do_pl', type: 'misformation', name: 'has / does вместо have / do',
    hint: 'С I, you, we, they говорим have, do, don’t — а не has, does, doesn’t.',
    find(t, add) {
      const map = { has: 'have', does: 'do', "doesn't": "don't" };
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s || s.p === '3s') continue;
        const j = afterAdv(t, s.e + 1);
        if (map[t[j]]) add(s.s, j, [...t.slice(s.s, j), map[t[j]]]);
      }
    } },

  { id: 's_extra', type: 'addition', name: 'Лишнее окончание -s',
    hint: 'С I, you, we, they окончание -s у глагола не нужно: I like, they play.',
    find(t, add) {
      for (let i = 0; i < t.length; i++) {
        const s = subj(t, i); if (!s || s.p === '3s') continue;
        const j = afterAdv(t, s.e + 1), v = t[j];
        if (THIRD_REV[v] && v !== 'has' && v !== 'does') add(s.s, j, [...t.slice(s.s, j), THIRD_REV[v]]);
      }
    } },

  { id: 'very_like', type: 'misordering', name: 'Неправильное место слова very',
    hint: 'Нельзя сказать «I very like». Говорим: I like it very much — very much ставим в конец.',
    find(t, add) {
      t.forEach((w, i) => {
        if (w === 'very' && ['like', 'love', 'want', 'enjoy', 'likes', 'loves', 'wants'].includes(t[i + 1]))
          add(i, i + 1, [t[i + 1]], { tail: ['very', 'much'] });
      });
    } },

  { id: 'modal_to', type: 'addition', name: 'Лишнее to после can / must',
    hint: 'После can, must, should частица to не нужна: I can swim (а не can to swim).',
    find(t, add) { t.forEach((w, i) => { if (MODAL.has(w) && t[i + 1] === 'to' && t[i + 2]) add(i, i + 2, [w, t[i + 2]]); }); } },

  { id: 'listen_to', type: 'omission', name: 'Пропущен предлог to после listen',
    hint: 'Слушать что-то — listen to: I listen to music.',
    find(t, add) {
      t.forEach((w, i) => {
        if (['listen', 'listens', 'listened', 'listening'].includes(w) && LISTEN_OBJ.has(t[i + 1])) add(i, i, [w, 'to']);
      });
    } },

  { id: 'go_to_home', type: 'addition', name: 'Лишний предлог to (go home, go fishing)',
    hint: 'Говорим go home, go fishing, go shopping — без to.',
    find(t, add) {
      t.forEach((w, i) => {
        if (GO.has(w) && t[i + 1] === 'to' && (t[i + 2] === 'home' || ING_ACT.has(t[i + 2]))) add(i, i + 2, [w, t[i + 2]]);
      });
    } },

  { id: 'time_prep', type: 'misformation', name: 'Неправильный предлог времени',
    hint: 'Запомни: on Monday, in winter, in the morning, at night, at the weekend.',
    find(t, add) {
      t.forEach((w, i) => {
        const n = t[i + 1];
        if ((w === 'in' || w === 'at') && DAYS.has(n)) add(i, i, ['on']);
        else if ((w === 'at' || w === 'on') && SEASONS.has(n)) add(i, i, ['in']);
        else if ((w === 'in' || w === 'at' || w === 'on') && DAYPART.has(n)) add(i, i + 1, ['in', 'the', n]);
        else if (w === 'in' && n === 'night') add(i, i, ['at']);
        else if (w === 'in' && n === 'weekend') add(i, i + 1, ['at', 'the', 'weekend']);
      });
    } },

  { id: 'a_an', type: 'misformation', name: 'a вместо an (или наоборот)',
    hint: 'Перед словом, которое начинается с гласного звука (apple, orange, elephant), ставим an, а перед согласным — a.',
    find(t, add) {
      t.forEach((w, i) => {
        const n = t[i + 1]; if (!n || /^\d/.test(n)) return;
        if (w === 'a' && needsAn(n)) add(i, i + 1, ['an', n]);
        if (w === 'an' && !needsAn(n) && !/^h/.test(n)) add(i, i + 1, ['a', n]);
      });
    } },

  { id: 'no_article', type: 'omission', name: 'Пропущен артикль a / an',
    hint: 'Когда говорим об одном предмете, животном или профессии, ставим перед словом a или an: I have a dog, she is a teacher.',
    find(t, add) {
      t.forEach((w, i) => {
        if (HAVE.has(w) && HAVE_N.has(t[i + 1])) add(i + 1, i + 1, [art(t[i + 1]), t[i + 1]]);
        if (w === 'is' || w === 'was') {
          const j = i + 1, adj = PRE_N_ADJ.has(t[j]) || ADJ.has(t[j]);
          const n = adj ? t[j + 1] : t[j];
          if (IS_N.has(n)) add(j, adj ? j + 1 : j, [art(t[j]), ...t.slice(j, adj ? j + 2 : j + 1)]);
        }
      });
    } },

  { id: 'plural', type: 'omission', name: 'Нет окончания множественного числа',
    hint: 'Если предметов больше одного (two, three, many), к слову добавляем -s: two cats, many friends.',
    find(t, add) {
      t.forEach((w, i) => {
        const isMany = MANY.has(w) || (/^\d+$/.test(w) && +w > 1) || (w === 'of' && t[i - 1] === 'lot');
        if (!isMany) return;
        let j = i + 1;
        if (ADJ.has(t[j]) || PRE_N_ADJ.has(t[j])) j++;
        const n = t[j];
        if (COUNT_N.has(n) && plural(n) !== n) add(i, j, [...t.slice(i, j), plural(n)]);
      });
    } },

  { id: 'wrong_plural', type: 'misformation', name: 'Неправильное множественное число',
    hint: 'У некоторых слов особое множественное число: child → children, man → men, foot → feet, mouse → mice.',
    find(t, add) { t.forEach((w, i) => { if (WRONG_PLURAL[w]) add(i, i, [WRONG_PLURAL[w]]); }); } },

  { id: 'compar_double', type: 'addition', name: 'Лишнее more',
    hint: 'Нельзя ставить вместе more и -er. Говорим bigger или more beautiful, но не more bigger.',
    find(t, add) { t.forEach((w, i) => { if (w === 'more' && COMP_FORMS.has(t[i + 1])) add(i, i + 1, [t[i + 1]]); }); } },

  { id: 'compar_form', type: 'misformation', name: 'Неправильная степень сравнения',
    hint: 'Короткие слова: big → bigger, cold → colder. Особые: good → better, bad → worse. Длинные: more beautiful.',
    find(t, add) {
      t.forEach((w, i) => {
        if (BAD_COMP[w]) add(i, i, BAD_COMP[w].split(' '));
        if (w === 'more' && (SHORT_ADJ.has(t[i + 1]) || t[i + 1] === 'good' || t[i + 1] === 'bad')) add(i, i + 1, [comp(t[i + 1])]);
      });
    } },

  { id: 'me_subject', type: 'misformation', name: 'me вместо I',
    hint: 'Когда «я» делает что-то, говорим I: I like pizza (а не me like).',
    find(t, add) { if (t[0] === 'me' && t[1] && (verbBase(t[1]) || BE.has(t[1]))) add(0, 0, ['i']); } }
];

const RULE_BY_ID = {};
RULES.forEach(r => { RULE_BY_ID[r.id] = r; });

// --- Главная функция: проверить одну фразу -----------------------------
// ctx.past — вопрос о прошлом; ctx.ask — ученик задаёт вопрос
function checkSentence(text, ctx) {
  ctx = ctx || {};
  const { raw, t } = tokenize(text);
  const errors = [];
  for (const r of RULES) {
    r.find(t, (start, end, repl, extra) => {
      if (errors.some(e => !(end < e.start || start > e.end))) return;   // это место уже занято
      errors.push(Object.assign({
        rule: r.id, type: r.type, name: r.name, hint: r.hint, start, end, repl,
        wrong: raw.slice(start, end + 1).join(' '),
        right: niceWords(repl, raw, t, start, end)
      }, extra || {}));
    }, ctx);
  }
  errors.sort((a, b) => a.start - b.start);
  return { tokens: t, errors, fixed: applyFixes(raw, t, errors) };
}

// слова исправления: где слово не поменялось — берём как сказал ученик
function niceWords(repl, raw, t, start, end) {
  return repl.map(w => {
    for (let k = start; k <= end; k++) if (t[k] === w) return raw[k];
    return w === 'i' ? 'I' : w;
  }).join(' ');
}

function applyFixes(raw, t, errors) {
  const out = []; let tail = [];
  for (let i = 0; i < raw.length;) {
    const e = errors.find(x => x.start === i);
    if (e) { out.push(e.right); if (e.tail) tail = tail.concat(e.tail); i = e.end + 1; }
    else { out.push(raw[i] === 'i' ? 'I' : raw[i]); i++; }
  }
  let s = out.concat(tail).join(' ').trim();
  if (!s) return '';
  s = s.charAt(0).toUpperCase() + s.slice(1);
  const q = WH.has(t[0]) || AUX.has(t[0]) || BE.has(t[0]);
  return s + (q ? '?' : '.');
}

// =====================================================================

// ---------- Темы и вопросы для разговора ----------
const TOPICS = [

const DB_KEY = 'bibi_db_v1';
function emptyDB() {
  return { version: 1, settings: { pin: '1234', voice: '', rate: 0.95, pitch: 1.1, lastBackup: null },
    classes: [], students: [], sessions: [], utterances: [] };
}
function loadDB() {
  try {
    const s = localStorage.getItem(DB_KEY);
    if (s) {
      const d = JSON.parse(s), e = emptyDB();
      return Object.assign(e, d, { settings: Object.assign(e.settings, d.settings || {}) });
    }
  } catch (err) { console.error(err); }
  return emptyDB();
}
let db = loadDB();
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch (err) { alert('Не получилось сохранить данные! Сделайте резервную копию в панели учителя.'); }
}

// ---------- Голос: выбираем приятный женский ----------
const FEMALE = ['aria', 'jenny', 'ava', 'emma', 'michelle', 'ana', 'sonia', 'libby', 'maisie', 'natasha', 'clara',
  'sara', 'nancy', 'jane', 'samantha', 'karen', 'moira', 'tessa', 'serena', 'victoria', 'allison', 'susan', 'zira',
  'hazel', 'catherine', 'fiona', 'kate', 'female', 'google us english', 'salli', 'joanna', 'kendra', 'kimberly', 'ivy', 'amy', 'emily', 'linda'];
const MALE = /\b(male|david|mark|george|guy|ryan|christopher|eric|daniel|alex|fred|tom|james|brian|roger|steffan|andrew|brandon|william|liam|thomas)\b/;
function voiceScore(v) {
  const n = v.name.toLowerCase();
  if (!/^en/i.test(v.lang)) return -100;
  let s = 0;
  if (FEMALE.some(f => n.includes(f))) s += 10;
  if (/natural|neural/.test(n)) s += 25;
  if (/online/.test(n)) s += 5;
  if (/google/.test(n)) s += 8;
  if (/en[-_](us|gb)/i.test(v.lang)) s += 2;
  if (MALE.test(n) && !/female/.test(n)) s -= 40;
  return s;
}
function englishVoices() {
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
}
function pickVoice() {
  const all = englishVoices();
  if (db.settings.voice) { const v = all.find(x => x.name === db.settings.voice); if (v) return v; }
  return all[0] || null;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { if (!$('#scr-teacher').classList.contains('hidden') && teacherTab === 'settings') renderTeacher(); };

function speak(text) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    speechSynthesis.cancel();
    const clean = text.replace(/[^\w\s.,!?'’…:-]/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = +db.settings.rate || 0.95;
    u.pitch = +db.settings.pitch || 1.1;
    let done = false;
    const fin = () => { if (done) return; done = true; owlTalk(false); res(); };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 2500 + clean.length * 110);    // на случай, если браузер «забыл» сказать, что закончил
    owlTalk(true);
    setTimeout(() => speechSynthesis.speak(u), 60);
  });
}

// ---------- Распознавание речи ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startListening() {
  if (!SR) { toast('В этом браузере нет распознавания речи. Откройте в Chrome или Edge, или пишите ответ.'); return; }
  if (listening) { rec.stop(); return; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  let finalText = '';
  rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.continuous = false;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $('#heard').textContent = (finalText + ' ' + interim).trim();
  };
  rec.onerror = e => {
    const msg = { 'not-allowed': 'Разреши доступ к микрофону 🎤 (значок слева от адреса сайта)',
      'no-speech': 'Я ничего не услышала. Попробуй ещё раз!', 'network': 'Нет интернета — распознавание не работает. Напиши ответ текстом.',
      'audio-capture': 'Микрофон не найден 🎤' }[e.error] || ('Ошибка микрофона: ' + e.error);
    toast(msg);
  };
  rec.onend = () => {
    listening = false; micUI();
    const txt = finalText.trim();
    $('#heard').textContent = '';
    if (txt) handleAnswer(txt, 'voice');
  };
  try { rec.start(); listening = true; micUI(); } catch (err) { toast('Микрофон занят, попробуй ещё раз'); }
}
function micUI() {
  const b = $('#mic');
  if (!b) return;
  b.classList.toggle('listening', listening);
  b.disabled = !chat || chat.busy;
  $('#mic-label').textContent = listening ? 'Слушаю… нажми, когда закончишь' : (chat && chat.busy ? 'Bibi говорит…' : 'Нажми и говори');
  $('#text-answer').disabled = !chat || chat.busy;
  $('#send').disabled = !chat || chat.busy;
}

let chat = null;
function startTopic(id) {
  const topic = TOPICS.find(t => t.id === id);
  const session = { id: uid(), studentId: me.id, classId: me.classId, topic: id, start: new Date().toISOString(), end: null, survey: null };

    await botTalk(`Hi, ${me.name}! Let's talk about ${topic.title.replace('&', 'and')}.`, `Привет! Поговорим на тему «${topic.ru}».`);

function addMsg(who, text, ru, extraHTML) {
  const box = $('#messages');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = who === 'bot'
    ? `<div class="avatar">${owlSVG('mini')}</div><div class="bubble"><div>${esc(text)}</div>${ru ? `<button class="tr-btn" data-act="tr">перевод</button><div class="tr hidden">${ru}</div>` : ''}${extraHTML || ''}</div>`
    : `<div class="bubble">${esc(text)}${extraHTML || ''}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
async function botTalk(en, ruHTML, extraHTML) {
  chat.busy = true; micUI();
  chat.lastBot = en;
  addMsg('bot', en, ruHTML, extraHTML);
  await speak(en);
}
async function askQuestion() {
  const q = chat.topic.qs[chat.qi];
  chat.attempt = 1; chat.firstUtt = null; chat.shortTries = 0;
  $('#progress').textContent = `Вопрос ${chat.qi + 1} из ${chat.topic.qs.length}`;
  $('#progress-bar').style.width = (chat.qi / chat.topic.qs.length * 100) + '%';
  await botTalk(q.en, esc(q.ru) + (q.ex ? `<br><span class="ex">Например: ${esc(q.ex)}</span>` : ''));
  chat.busy = false; micUI();
}

async function handleAnswer(text, source) {
  if (!chat || chat.busy) return;
  chat.busy = true; micUI();
  const q = chat.topic.qs[chat.qi];
  const res = checkSentence(text, { past: !!q.past, ask: !!q.ask || /\?\s*$/.test(text) });
  const utt = {
    id: uid(), sessionId: chat.session.id, studentId: me.id, classId: me.classId, time: new Date().toISOString(),
    topic: chat.topic.id, question: q.en, text, source, attempt: chat.attempt, words: res.tokens.length,
    errors: res.errors.map(e => ({ rule: e.rule, type: e.type, wrong: e.wrong, right: e.right + (e.tail ? ' … ' + e.tail.join(' ') : ''), verdict: null })),
    fixed: res.fixed, corrected: null, missed: 0, checked: false
  };
  db.utterances.push(utt); saveDB();
  addMsg('me', text, null, res.errors.length ? '<span class="dot" title="есть ошибка"></span>' : '');

  // слишком короткий ответ — просим полное предложение (один раз)
  if (res.tokens.length < 3 && !q.ask && !res.errors.length && chat.shortTries < 1) {
    chat.shortTries++;
    await botTalk('Can you say a full sentence, please?', 'Ответь полным предложением 🙂' + (q.ex ? `<br><span class="ex">Например: ${esc(q.ex)}</span>` : ''));
    chat.busy = false; micUI(); return;
  }

  if (res.errors.length) {
    const e = res.errors[0];
    if (chat.attempt === 1) {
      chat.firstUtt = utt; chat.attempt = 2;
      // подсказка: не говорим ответ сразу, а показываем, где ошибка и какое правило
      await botTalk(rand(TRY_AGAIN), null,
        `<div class="hint">💡 ${esc(e.hint)}<div class="hint-where">Посмотри сюда: <mark>${esc(e.wrong)}</mark></div>${res.errors.length > 1 ? `<div class="muted">Ошибок в фразе: ${res.errors.length}</div>` : ''}</div>`);
      chat.busy = false; micUI(); return;
    }
    // вторая попытка тоже с ошибкой — показываем правильный вариант и идём дальше
    chat.firstUtt.corrected = false; saveDB();
    await botTalk(`Let's say it like this: ${res.fixed}`, null, `<div class="hint good">✅ Правильно так: <b>${esc(res.fixed)}</b></div>`);
    return nextQuestion();
  }

  if (chat.firstUtt) {
    chat.firstUtt.corrected = true; saveDB();
    owlHappy();
    await botTalk(rand(PRAISE), '🌟 Молодец, ты исправил(а) ошибку!');
  } else if (q.ask) {
    owlHappy();
    await botTalk(answerAsOwl(res.tokens.join(' ')));
  } else {
    owlHappy();
    await botTalk(react(res.tokens.join(' ')));
  }
  nextQuestion();
}
function react(s) { for (const [re, ans] of REACT) if (re.test(s)) return ans; return rand(DEFAULT_REACT); }
function answerAsOwl(s) { for (const [re, ans] of OWL_ANSWERS) if (re.test(s)) return 'Good question! ' + ans; return 'Good question! Hmm… hoo-hoo! I need to think about it.'; }

function nextQuestion() {
  chat.qi++;
  if (chat.qi >= chat.topic.qs.length) return finishTopic();
  askQuestion();
}
async function finishTopic() {
  $('#progress-bar').style.width = '100%';
  await botTalk("That's all for today! You were great! Bye-bye!", 'На сегодня всё! Ты молодец! Пока-пока!');
  endSession(true);
}
function endSession(askSurvey) {
  if (listening && rec) rec.abort();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  chat.session.end = new Date().toISOString(); saveDB();
  const any = db.utterances.some(u => u.sessionId === chat.session.id);
  if (askSurvey && any) showSurvey(); else if (any) showSummary(); else { chat = null; renderHome(); }
}

function filterUtts(classId, studentId) {
  return db.utterances.filter(u => (classId === 'all' || u.classId === classId) && (!studentId || studentId === 'all' || u.studentId === studentId));
}
function classOptions(sel) {
  return `<option value="all" ${sel === 'all' ? 'selected' : ''}>Все классы</option>` +
    db.classes.map(c => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}
function bars(obj, labelFn, color) {
  const arr = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...arr.map(a => a[1]));
  return arr.length ? arr.map(([k, v]) => `<div class="bar-row"><div class="bar-label">${esc(labelFn(k))}</div>
    <div class="bar-track"><div class="bar" style="width:${v / max * 100}%;background:${typeof color === 'function' ? color(k) : color}"></div></div><div class="bar-val">${v}</div></div>`).join('')
    : '<p class="muted">Пока нет данных</p>';
}
const TYPE_COLORS = { omission: '#ff9ec4', addition: '#ffc46b', misformation: '#9b7bf2', misordering: '#5cc8a8' };
function tStats() {
  const utts = filterUtts(statClass);
  const errs = utts.flatMap(u => u.errors);
  const byType = {}, byRule = {};
  errs.forEach(e => { byType[e.type] = (byType[e.type] || 0) + 1; byRule[e.rule] = (byRule[e.rule] || 0) + 1; });
  const firsts = utts.filter(u => u.attempt === 1 && u.errors.length);
  const fixed = firsts.filter(u => u.corrected === true).length, notFixed = firsts.filter(u => u.corrected === false).length;
  const sessions = db.sessions.filter(s => statClass === 'all' || s.classId === statClass);
  const sv = sessions.filter(s => s.survey);
  const avg = k => { const a = sv.map(s => s.survey[k]).filter(Boolean); return a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(1) : '—'; };
  const students = db.students.filter(s => statClass === 'all' || s.classId === statClass);
  return `<div class="row"><label>Класс: <select class="inp" data-change="stat-class">${classOptions(statClass)}</select></label></div>
  <div class="cards">
    <div class="stat"><b>${students.length}</b><span>учеников</span></div>
    <div class="stat"><b>${sessions.filter(s => s.end).length}</b><span>разговоров</span></div>
    <div class="stat"><b>${utts.length}</b><span>фраз сказано</span></div>
    <div class="stat"><b>${errs.length}</b><span>ошибок найдено</span></div>
    <div class="stat"><b>${pct(fixed, fixed + notFixed)}</b><span>исправлено после подсказки</span></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Ошибки по типам</h3>${bars(byType, k => TYPES[k], k => TYPE_COLORS[k])}</div>
    <div class="card"><h3>Самые частые ошибки</h3>${bars(Object.fromEntries(Object.entries(byRule).sort((a, b) => b[1] - a[1]).slice(0, 7)), ruleName, '#b9a2ff')}</div>
  </div>
  <div class="card"><h3>Ученики</h3><table class="tbl"><tr><th>Ученик</th><th>Класс</th><th>Разговоров</th><th>Фраз</th><th>Ошибок</th><th>Частая ошибка</th><th>Исправил после подсказки</th></tr>
  ${students.map(s => {
    const u = db.utterances.filter(x => x.studentId === s.id), r = {};
    u.forEach(x => x.errors.forEach(e => { r[e.rule] = (r[e.rule] || 0) + 1; }));
    const top = Object.entries(r).sort((a, b) => b[1] - a[1])[0];
    const f = u.filter(x => x.attempt === 1 && x.errors.length);
    const fx = f.filter(x => x.corrected === true).length, nf = f.filter(x => x.corrected === false).length;
    return `<tr><td><a href="#" data-act="student" data-id="${s.id}">${esc(s.name)}</a></td><td>${esc(className(s.classId))}</td>
      <td>${db.sessions.filter(x => x.studentId === s.id && x.end).length}</td><td>${u.length}</td><td>${u.reduce((a, x) => a + x.errors.length, 0)}</td>
      <td>${top ? esc(ruleName(top[0])) + ` (${top[1]})` : '—'}</td><td>${pct(fx, fx + nf)}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="muted">Нет учеников</td></tr>'}</table></div>

}

// ---- Проверка учителем (для эксперимента: бот vs учитель) ----
function tCheck() {
  const sts = db.students.filter(s => checkClass === 'all' || s.classId === checkClass);
  const all = filterUtts(checkClass, checkStudent);
  const checked = all.filter(u => u.checked);
  let ok = 0, wrong = 0, missed = 0;
  checked.forEach(u => { u.errors.forEach(e => { if (e.verdict === 'false') wrong++; else ok++; }); missed += u.missed || 0; });
  const list = all.filter(u => !checkOnlyNew || !u.checked).sort((a, b) => b.time.localeCompare(a.time)).slice(0, 60);
  return `<div class="card info">Здесь учитель проверяет работу бота. Для каждой фразы отметьте: верно ли бот нашёл ошибку (✔ / ✖), и сколько ошибок бот <b>пропустил</b>. Потом нажмите «Проверено».</div>
  <div class="row"><label>Класс: <select class="inp" data-change="check-class">${classOptions(checkClass)}</select></label>
    <label>Ученик: <select class="inp" data-change="check-student"><option value="all">Все</option>${sts.map(s => `<option value="${s.id}" ${checkStudent === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>

  <div class="cards">
    <div class="stat"><b>${checked.length}</b><span>фраз проверено</span></div>
    <div class="stat"><b>${ok}</b><span>бот нашёл верно</span></div>
    <div class="stat"><b>${wrong}</b><span>бот ошибся (ложная ошибка)</span></div>
    <div class="stat"><b>${missed}</b><span>бот пропустил</span></div>
    <div class="stat hl"><b>${pct(ok, ok + wrong)}</b><span>точность</span></div>
    <div class="stat hl"><b>${pct(ok, ok + missed)}</b><span>полнота</span></div>
  </div>
  <p class="muted small"><b>Точность</b> — какая часть найденных ботом ошибок действительно ошибки. <b>Полнота</b> — какую часть всех ошибок (найденных учителем) нашёл бот.</p>
  ${list.map(u => `<div class="card vcard ${u.checked ? 'done' : ''}">
    <div class="muted small">${esc(studentName(u.studentId))} · ${esc(className(u.classId))} · ${fmtDate(u.time)} · ${esc(u.question)}</div>
    <div class="vtext">«${esc(u.text)}»</div>
    ${u.errors.length ? u.errors.map((e, i) => `<div class="vline">${errChip(e)}
      <button class="btn small ${e.verdict === 'ok' ? 'on' : 'ghost'}" data-act="verdict" data-id="${u.id}" data-i="${i}" data-v="ok">✔ верно</button>
      <button class="btn small ${e.verdict === 'false' ? 'on-bad' : 'ghost'}" data-act="verdict" data-id="${u.id}" data-i="${i}" data-v="false">✖ бот ошибся</button></div>`).join('')
      : '<div class="muted">Бот не нашёл ошибок.</div>'}
    <div class="row">Бот пропустил ошибок: <button class="btn small ghost" data-act="missed" data-id="${u.id}" data-d="-1">−</button><b>${u.missed || 0}</b><button class="btn small ghost" data-act="missed" data-id="${u.id}" data-d="1">+</button>
      <button class="btn small ${u.checked ? 'on' : ''}" data-act="checked" data-id="${u.id}">${u.checked ? 'Проверено ✓' : 'Проверено'}</button></div>
  </div>`).join('') || '<p class="muted">Нет фраз для проверки.</p>'}`;
}

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  db.settings.lastBackup = new Date().toISOString(); saveDB();

function exportCSV() {
  const rows = [['Класс', 'Ученик', 'Код', 'Дата', 'Тема', 'Вопрос', 'Фраза ученика', 'Попытка', 'Тип ошибки', 'Ошибка', 'Было', 'Нужно', 'Исправил после подсказки', 'Оценка учителя', 'Бот пропустил']];
  db.utterances.forEach(u => {
    const s = db.students.find(x => x.id === u.studentId) || {};
    const base = [className(u.classId), s.name || '', s.code || '', fmtDate(u.time), topicTitle(u.topic).replace(/^\S+\s/, ''), u.question, u.text, u.attempt];
    const fixed = u.corrected === true ? 'да' : u.corrected === false ? 'нет' : '';
    if (!u.errors.length) rows.push([...base, '', 'нет ошибок', '', '', '', u.checked ? 'проверено' : '', u.missed || 0]);
    u.errors.forEach(e => rows.push([...base, TYPES[e.type], ruleName(e.rule), e.wrong, e.right, fixed, e.verdict === 'ok' ? 'верно' : e.verdict === 'false' ? 'бот ошибся' : '', u.missed || 0]));
  });
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  download(`bibi-oshibki-${today()}.csv`, csv, 'text/csv;charset=utf-8');
}
function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result); let added = 0;
      ['classes', 'students', 'sessions', 'utterances'].forEach(k => {
        (d[k] || []).forEach(item => {
          const old = db[k].find(x => x.id === item.id);
          if (!old) {
            if (k === 'classes') { const same = db.classes.find(c => c.name === item.name); if (same) { remapClass(d, item.id, same.id); return; } }
            if (k === 'students' && db.students.some(s => s.code === item.code)) return;
            db[k].push(item); added++;
          } else if (k === 'utterances' && item.checked && !old.checked) { Object.assign(old, item); }
          else if (k === 'sessions' && item.end && !old.end) { Object.assign(old, item); }
        });
      });
      saveDB(); renderTeacher(); toast(`Готово! Добавлено записей: ${added}`);
    } catch (err) { alert('Не получилось прочитать файл: ' + err.message); }
  };
  fr.readAsText(file);
}
function remapClass(d, from, to) {     // класс с таким же названием уже есть — переносим учеников в него
  ['students', 'sessions', 'utterances'].forEach(k => (d[k] || []).forEach(x => { if (x.classId === from) x.classId = to; }));
}
function printCodes(classId) {
  const c = db.classes.find(x => x.id === classId);
  const sts = db.students.filter(s => s.classId === classId).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const w = window.open('', '_blank');
  if (!w) { toast('Разрешите всплывающие окна для печати'); return; }
  w.document.write(`<html><head><meta charset="utf-8"><title>Коды ${esc(c.name)}</title><style>
    body{font-family:Arial,sans-serif;padding:10px} .c{display:inline-block;width:29%;margin:6px;padding:14px;border:2px dashed #b39cff;border-radius:16px;text-align:center;vertical-align:top}
    .k{font-size:26px;font-weight:bold;letter-spacing:2px;color:#6b4fd8;margin-top:6px} .n{font-size:16px}</style></head><body>
    <h2>🦉 Bibi — коды для входа · класс ${esc(c.name)}</h2>
    ${sts.map(s => `<div class="c"><div class="n">${esc(s.name)}</div><div class="k">${s.code}</div></div>`).join('')}
    <script>setTimeout(function(){print()},300)<\/script></body></html>`);
  w.document.close();
}

// =====================================================================
//  ОБРАБОТКА НАЖАТИЙ (одна функция на всю страницу)
// =====================================================================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act], .tab');
  if (!el) return;
  if (el.classList.contains('tab')) { teacherTab = el.dataset.tab; renderTeacher(); return; }
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'login': login(); break;
    case 'teacher': askPin(); break;
    case 'pin-ok': pinOk(); break;
    case 'close': closeModal(); break;
    case 'logout': me = null; renderLogin(); break;
    case 'topic': startTopic(id); break;
    case 'my-errors': showMyErrors(); break;
    case 'mic': startListening(); break;
    case 'send': sendText(); break;
    case 'repeat': if (chat && !chat.busy && chat.lastBot) { chat.busy = true; micUI(); speak(chat.lastBot).then(() => { if (chat) { chat.busy = false; micUI(); } }); } break;
    case 'stop': if (chat) { if (confirm('Закончить разговор?')) endSession(true); } break;
    case 'tr': el.nextElementSibling.classList.toggle('hidden'); break;
    case 'face': {
      chat.survey[el.dataset.k] = +el.dataset.v;
      el.parentElement.querySelectorAll('.face').forEach(b => b.classList.toggle('sel', b === el)); break;
    }
    case 'survey-save': chat.session.survey = chat.survey; saveDB(); showSummary(); break;
    case 'survey-skip': showSummary(); break;
    case 'again': renderHome(); break;
    case 'exit-teacher': renderLogin(); break;
    case 'add-class': {
      const n = $('#new-class').value.trim(); if (!n) return;
      if (db.classes.some(c => c.name.toLowerCase() === n.toLowerCase())) { toast('Такой класс уже есть'); return; }
      db.classes.push({ id: uid(), name: n }); saveDB(); renderTeacher(); break;
    }
    case 'rename-class': {
      const c = db.classes.find(x => x.id === id); const n = prompt('Новое название класса', c.name);
      if (n && n.trim()) { c.name = n.trim(); saveDB(); renderTeacher(); } break;
    }
    case 'del-class': {
      const has = db.students.some(s => s.classId === id);
      if (has) { toast('Сначала удалите учеников из класса'); return; }
      if (confirm('Удалить класс?')) { db.classes = db.classes.filter(c => c.id !== id); saveDB(); renderTeacher(); } break;
    }
    case 'add-students': {
      const names = $('#names-' + id).value.split('\n').map(s => s.trim()).filter(Boolean);
      names.forEach(n => db.students.push({ id: uid(), name: n, classId: id, code: newCode(), created: new Date().toISOString() }));
      saveDB(); renderTeacher(); if (names.length) toast(`Добавлено учеников: ${names.length}`); break;
    }
    case 'del-student': {
      const s = db.students.find(x => x.id === id);
      if (!confirm(`Удалить ученика ${s.name} и все его ответы?`)) return;
      db.students = db.students.filter(x => x.id !== id);
      db.sessions = db.sessions.filter(x => x.studentId !== id);
      db.utterances = db.utterances.filter(x => x.studentId !== id);
      saveDB(); renderTeacher(); break;
    }
    case 'print-codes': printCodes(id); break;
    case 'student': showStudent(id); break;
    case 'verdict': {
      const u = db.utterances.find(x => x.id === id), er = u.errors[+el.dataset.i];
      er.verdict = er.verdict === el.dataset.v ? null : el.dataset.v; saveDB(); renderTeacher(); break;
    }
    case 'missed': { const u = db.utterances.find(x => x.id === id); u.missed = Math.max(0, (u.missed || 0) + +el.dataset.d); saveDB(); renderTeacher(); break; }
    case 'checked': {
      const u = db.utterances.find(x => x.id === id); u.checked = !u.checked;
      if (u.checked) u.errors.forEach(er => { if (!er.verdict) er.verdict = 'ok'; });
      saveDB(); renderTeacher(); break;
    }
    case 'test-voice': speak('Hello! I am Bibi, your English friend. Let’s talk!'); break;
    case 'export': exportJSON(); renderTeacher(); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#file-import').click(); break;
    case 'save-pin': { const p = $('#new-pin').value.trim(); if (p.length < 4) { toast('PIN — минимум 4 символа'); return; } db.settings.pin = p; saveDB(); toast('PIN сохранён'); renderTeacher(); break; }
    case 'wipe': {
      if (!confirm('Точно удалить ВСЕ данные? Сначала сделайте резервную копию!')) return;
      if (prompt('Напишите слово УДАЛИТЬ') !== 'УДАЛИТЬ') return;
      db = emptyDB(); saveDB(); renderTeacher(); toast('Все данные удалены'); break;
    }
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change; if (!k) return;
  const v = e.target.value;
  if (k === 'stat-class') statClass = v;
  if (k === 'check-class') { checkClass = v; checkStudent = 'all'; }
  if (k === 'check-student') checkStudent = v;
  if (k === 'check-new') checkOnlyNew = e.target.checked;
  if (k === 'voice') { db.settings.voice = v; saveDB(); }
  if (k === 'rate') { db.settings.rate = +v; saveDB(); }
  if (k === 'pitch') { db.settings.pitch = +v; saveDB(); }
  renderTeacher();
});
function sendText() {
  const inp = $('#text-answer'); const v = inp.value.trim();
  if (!v || !chat || chat.busy) return;
  inp.value = ''; handleAnswer(v, 'text');
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'code') login();
  if (e.target.id === 'pin') pinOk();
  if (e.target.id === 'text-answer') sendText();
  if (e.target.id === 'new-class') $('[data-act="add-class"]').click();
});
$('#file-import').addEventListener('change', e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !chat) closeModal(); });

renderLogin();

</script>
